services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanrep-postgres
    environment:
      POSTGRES_USER: cleanrep
      POSTGRES_PASSWORD: cleanrep
      POSTGRES_DB: cleanrep
    ports:
      - '5432:5432'
    volumes:
      - cleanrep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleanrep -d cleanrep']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cleanrep-postgres-data:
